<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B2545">
<title>Kejohanan — Maxxima Badminton Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>try{var m=localStorage.getItem('mx_theme');if(m==='dark'||(m==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.dataset.theme='dark'}catch(e){}</script>
<link rel="stylesheet" href="css/app.css">
<link rel="icon" type="image/png" href="assets/favicon.png">
<style>
.reg{min-height:100vh;padding:22px 14px 40px;background:linear-gradient(160deg,#0B2545 0%,#13315C 55%,#1D4173 100%)}
.reg-card{max-width:680px;margin:0 auto;background:var(--surface);border-radius:20px;padding:24px 22px;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.reg-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.reg h1{font-size:22px;font-weight:800;margin:14px 0 4px}.reg h3{font-size:15px;margin:22px 0 10px}
.kid{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;background:var(--bg)}
.kid-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.progs{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}.progs label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;background:var(--surface)}
.progs input{width:auto;height:auto}.self{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:12px;background:var(--brand-soft,#eef2ff);margin-bottom:12px;font-size:13.5px;cursor:pointer}
.self input{width:auto;height:auto;margin-top:3px}.hp{position:absolute;left:-9999px}.done{text-align:center;padding:30px 10px}.done .big{font-size:46px}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:13px;margin-top:14px}.consent input{width:auto;height:auto;margin-top:3px}
.reg-card{max-width:820px}
.tn-hero{border-radius:16px;overflow:hidden;background:#0B2545;color:#fff;margin:10px 0 16px}.tn-hero img{display:block;width:100%;max-height:560px;object-fit:contain;background:#0B2545}
.tn-hero .in{padding:18px}.tn-hero h1{color:#fff;font-size:24px;line-height:1.2}.tn-hero p{color:#cbd5e1}
.tn-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:12px}.tn-stats div{background:rgba(255,255,255,.08);border-radius:12px;padding:10px}.tn-stats b{display:block;font-size:18px;color:#fff}.tn-stats small{color:#cbd5e1}
.tn-hero .btn.primary{background:#C6F432;color:#0B2545;border-color:#C6F432}
.tn-nav{display:flex;gap:6px;flex-wrap:wrap;position:sticky;top:0;background:var(--surface);padding:8px 0;z-index:5;border-bottom:1px solid var(--line);margin-bottom:10px}
.tn-nav a{font-size:12.5px;font-weight:600;padding:6px 10px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);text-decoration:none}
.tn-sec{margin:22px 0}.tn-sec h2{font-size:18px;margin-bottom:10px}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}.cat-c{border:1px solid var(--line);border-radius:14px;padding:12px}.cat-c b{display:block}.cat-c.full{opacity:.5}
.dates{display:flex;flex-direction:column;gap:6px}.dates div{display:flex;gap:12px;font-size:13.5px}.dates b{min-width:96px}
.steps{display:flex;gap:6px;margin-bottom:12px}.steps span{flex:1;height:5px;border-radius:9px;background:var(--line)}.steps span.on{background:var(--brand)}
.rules details{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}.rules summary{font-weight:700;cursor:pointer}.rules li{margin:4px 0 4px 18px;font-size:13.5px}
table.st{width:100%;border-collapse:collapse;font-size:13px}table.st td,table.st th{padding:6px;border-bottom:1px solid var(--line);text-align:center}table.st td:first-child,table.st th:first-child{text-align:left}
.sizes{display:flex;gap:6px;flex-wrap:wrap}.sizes label{border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;font-weight:600}.sizes input{display:none}.sizes input:checked+span{color:var(--brand)}.sizes label:has(input:checked){border-color:var(--brand);background:var(--surface-2)}
</style>
</head>
<body>
<div class="reg"><div class="reg-card" id="reg"><div class="boot">Memuatkan…</div></div></div>
<div class="toast" id="toast" role="status"></div>
<script type="module" src="js/tournament-public.js"></script>
</body>
</html>
